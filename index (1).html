<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>MK Calculator</title>

<style>
:root{
  --bg:#08090b;
  --card:#151619;
  --display:#0e0f11;
  --key:#242528;
  --function:#303136;
  --text:#f5f5f7;
  --muted:#85878f;
  --accent:#ff9f0a;
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

body{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:15px;
  background:radial-gradient(circle at top,#292b31,#111216 40%,#060607);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  color:var(--text);
}

.calculator{
  width:min(430px,100%);
  padding:18px;
  border-radius:32px;
  background:rgba(21,22,25,.97);
  border:1px solid rgba(255,255,255,.08);
  box-shadow:0 30px 80px rgba(0,0,0,.6);
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
}

.brand{
  display:flex;
  align-items:center;
  gap:9px;
}

.mk{
  width:39px;
  height:39px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:12px;
  background:#fff;
  color:#111;
  font-weight:900;
  letter-spacing:-1px;
}

.brand-name{
  font-size:18px;
  font-weight:700;
}

.brand-name span{
  color:#777;
  font-weight:400;
}

.history-btn{
  border:0;
  background:#25262a;
  color:#bbb;
  width:42px;
  height:42px;
  border-radius:13px;
  font-size:19px;
  cursor:pointer;
}

.display{
  min-height:155px;
  padding:20px 18px;
  margin-bottom:15px;
  border-radius:24px;
  background:var(--display);
  border:1px solid rgba(255,255,255,.05);
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  align-items:flex-end;
  overflow:hidden;
}

.expression{
  width:100%;
  min-height:23px;
  color:var(--muted);
  text-align:right;
  font-size:15px;
  overflow-x:auto;
  white-space:nowrap;
}

.result{
  width:100%;
  margin-top:8px;
  text-align:right;
  font-size:clamp(42px,11vw,64px);
  font-weight:350;
  letter-spacing:-2px;
  white-space:nowrap;
  overflow-x:auto;
}

.scientific{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:8px;
  margin-bottom:10px;
}

.scientific button{
  height:42px;
  border:0;
  border-radius:13px;
  background:#1d1e21;
  color:#c9cad0;
  font-size:13px;
}

.keys{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
}

.keys button{
  height:68px;
  border:0;
  border-radius:21px;
  background:var(--key);
  color:var(--text);
  font-size:22px;
  cursor:pointer;
  transition:.1s;
}

.keys button:active,
.history-btn:active,
.scientific button:active{
  transform:scale(.93);
}

.function{background:var(--function)!important}
.clear{color:#ff453a!important}
.delete{color:#ffb340!important}

.operator{
  background:var(--accent)!important;
  color:#111!important;
  font-size:27px!important;
}

.equals{
  background:#fff!important;
  color:#111!important;
  font-weight:700;
}

.zero{
  grid-column:span 2;
  text-align:left;
  padding-left:27px;
}

.footer{
  text-align:center;
  color:#55565d;
  font-size:9px;
  letter-spacing:1px;
  margin-top:14px;
}

/* HISTORY PANEL */

.history-panel{
  position:fixed;
  inset:0;
  z-index:100;
  background:rgba(0,0,0,.65);
  backdrop-filter:blur(10px);
  display:none;
  justify-content:flex-end;
}

.history-panel.active{
  display:flex;
}

.history-box{
  width:min(390px,92%);
  height:100%;
  padding:20px;
  background:#151619;
  border-left:1px solid rgba(255,255,255,.08);
  box-shadow:-20px 0 60px rgba(0,0,0,.45);
  animation:slide .2s ease;
  display:flex;
  flex-direction:column;
}

@keyframes slide{
  from{transform:translateX(100%)}
  to{transform:translateX(0)}
}

.history-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.history-title{
  font-size:21px;
  font-weight:700;
}

.close-history{
  width:38px;
  height:38px;
  border:0;
  border-radius:12px;
  background:#292a2e;
  color:#fff;
  font-size:20px;
}

.history-list{
  flex:1;
  overflow-y:auto;
}

.history-item{
  padding:15px;
  margin-bottom:10px;
  border-radius:16px;
  background:#202125;
  cursor:pointer;
}

.history-item .calc{
  color:#777980;
  font-size:13px;
  margin-bottom:5px;
}

.history-item .answer{
  color:#fff;
  font-size:21px;
  font-weight:600;
  text-align:right;
}

.empty{
  text-align:center;
  color:#666;
  margin-top:50px;
  font-size:14px;
}

.clear-history{
  height:50px;
  margin-top:15px;
  border:0;
  border-radius:16px;
  background:#292a2e;
  color:#ff453a;
  font-size:14px;
  font-weight:600;
}

@media(max-width:370px){
  .calculator{padding:13px}
  .keys{gap:8px}
  .keys button{height:59px;border-radius:18px}
  .scientific button{height:38px;font-size:12px}
}
</style>
</head>

<body>

<main class="calculator">

<header class="header">
  <div class="brand">
    <div class="mk">MK</div>
    <div class="brand-name">MK <span>Calculator</span></div>
  </div>

  <button class="history-btn" onclick="openHistory()" aria-label="History">
    ↶
  </button>
</header>

<section class="display">
  <div class="expression" id="expression"></div>
  <div class="result" id="display">0</div>
</section>

<section class="scientific">
  <button onclick="scientific('sin')">sin</button>
  <button onclick="scientific('cos')">cos</button>
  <button onclick="scientific('tan')">tan</button>
  <button onclick="scientific('sqrt')">√</button>
  <button onclick="scientific('square')">x²</button>

  <button onclick="scientific('log')">log</button>
  <button onclick="scientific('ln')">ln</button>
  <button onclick="scientific('pi')">π</button>
  <button onclick="scientific('e')">e</button>
  <button onclick="scientific('inverse')">1/x</button>
</section>

<section class="keys">
  <button class="function clear" onclick="clearAll()">AC</button>
  <button class="function delete" onclick="backspace()">⌫</button>
  <button class="function" onclick="percent()">%</button>
  <button class="operator" onclick="setOperator('/')">÷</button>

  <button onclick="inputNumber('7')">7</button>
  <button onclick="inputNumber('8')">8</button>
  <button onclick="inputNumber('9')">9</button>
  <button class="operator" onclick="setOperator('*')">×</button>

  <button onclick="inputNumber('4')">4</button>
  <button onclick="inputNumber('5')">5</button>
  <button onclick="inputNumber('6')">6</button>
  <button class="operator" onclick="setOperator('-')">−</button>

  <button onclick="inputNumber('1')">1</button>
  <button onclick="inputNumber('2')">2</button>
  <button onclick="inputNumber('3')">3</button>
  <button class="operator" onclick="setOperator('+')">+</button>

  <button class="zero" onclick="inputNumber('0')">0</button>
  <button onclick="decimal()">.</button>
  <button class="equals" onclick="calculate()">=</button>
</section>

<footer class="footer">MK • PROFESSIONAL CALCULATOR</footer>

</main>

<!-- HISTORY -->

<div class="history-panel" id="historyPanel">

  <div class="history-box">

    <div class="history-head">
      <div class="history-title">History</div>
      <button class="close-history" onclick="closeHistory()">×</button>
    </div>

    <div class="history-list" id="historyList"></div>

    <button class="clear-history" onclick="clearHistory()">
      Clear History
    </button>

  </div>
</div>

<script>
"use strict";

const display=document.getElementById("display");
const expression=document.getElementById("expression");
const historyPanel=document.getElementById("historyPanel");
const historyList=document.getElementById("historyList");

let current="0";
let stored=null;
let operator=null;
let waiting=false;
let calculated=false;

let history=JSON.parse(
  localStorage.getItem("mk_calculator_history") || "[]"
);

function render(){
  display.textContent=current;
}

function format(value){
  if(!Number.isFinite(value)) return "Error";
  if(Math.abs(value)<1e-12)value=0;
  return Number(value.toPrecision(12)).toString();
}

function inputNumber(n){

  if(current==="Error")clearAll();

  if(waiting || calculated){
    current=n;
    waiting=false;
    calculated=false;
  }else{
    current=current==="0"?n:current+n;
  }

  render();
}

function decimal(){

  if(current==="Error")clearAll();

  if(waiting || calculated){
    current="0.";
    waiting=false;
    calculated=false;
  }else if(!current.includes(".")){
    current+=".";
  }

  render();
}

function setOperator(next){

  if(current==="Error")return;

  const value=parseFloat(current);

  if(stored!==null && operator && !waiting){

    const result=calculateValue(stored,value,operator);

    if(result===null){
      showError();
      return;
    }

    stored=result;
    current=format(result);

  }else{
    stored=value;
  }

  operator=next;
  waiting=true;
  calculated=false;

  expression.textContent=
    format(stored)+" "+symbol(next);

  render();
}

function calculate(){

  if(stored===null || operator===null)return;

  const value=parseFloat(current);
  const result=calculateValue(stored,value,operator);

  if(result===null){
    showError();
    return;
  }

  const exp=
    format(stored)+" "+
    symbol(operator)+" "+
    format(value);

  expression.textContent=exp+" =";
  current=format(result);

  addHistory(exp,current);

  stored=null;
  operator=null;
  waiting=false;
  calculated=true;

  render();
}

function calculateValue(a,b,op){

  if(op==="+")return a+b;
  if(op==="-")return a-b;
  if(op==="*")return a*b;
  if(op==="/")return b===0?null:a/b;

  return b;
}

function symbol(op){
  return {
    "+":"+",
    "-":"−",
    "*":"×",
    "/":"÷"
  }[op]||op;
}

function clearAll(){
  current="0";
  stored=null;
  operator=null;
  waiting=false;
  calculated=false;
  expression.textContent="";
  render();
}

function backspace(){

  if(current==="Error"||waiting||calculated){
    current="0";
    waiting=false;
    calculated=false;
  }else{
    current=current.length>1?
      current.slice(0,-1):"0";
  }

  render();
}

function percent(){

  if(current==="Error")return;

  current=format(parseFloat(current)/100);
  calculated=false;

  render();
}

function scientific(type){

  if(current==="Error")return;

  const value=parseFloat(current);
  let result;
  let label;

  switch(type){

    case"sin":
      result=Math.sin(value*Math.PI/180);
      label="sin("+format(value)+"°)";
      break;

    case"cos":
      result=Math.cos(value*Math.PI/180);
      label="cos("+format(value)+"°)";
      break;

    case"tan":
      result=Math.tan(value*Math.PI/180);
      label="tan("+format(value)+"°)";
      break;

    case"sqrt":
      if(value<0){showError();return}
      result=Math.sqrt(value);
      label="√"+format(value);
      break;

    case"square":
      result=value*value;
      label=format(value)+"²";
      break;

    case"log":
      if(value<=0){showError();return}
      result=Math.log10(value);
      label="log("+format(value)+")";
      break;

    case"ln":
      if(value<=0){showError();return}
      result=Math.log(value);
      label="ln("+format(value)+")";
      break;

    case"pi":
      result=Math.PI;
      label="π";
      break;

    case"e":
      result=Math.E;
      label="e";
      break;

    case"inverse":
      if(value===0){showError();return}
      result=1/value;
      label="1/"+format(value);
      break;

    default:return;
  }

  expression.textContent=label;
  current=format(result);
  calculated=true;

  addHistory(label,current);

  render();
}

/* HISTORY */

function addHistory(calc,answer){

  history.unshift({
    calc:calc,
    answer:answer,
    time:Date.now()
  });

  if(history.length>100){
    history=history.slice(0,100);
  }

  localStorage.setItem(
    "mk_calculator_history",
    JSON.stringify(history)
  );

  renderHistory();
}

function renderHistory(){

  historyList.innerHTML="";

  if(history.length===0){

    historyList.innerHTML=
      '<div class="empty">No calculations yet</div>';

    return;
  }

  history.forEach((item,index)=>{

    const div=document.createElement("div");

    div.className="history-item";

    div.innerHTML=`
      <div class="calc">${escapeHTML(item.calc)} =</div>
      <div class="answer">${escapeHTML(item.answer)}</div>
    `;

    div.onclick=()=>{
      current=item.answer;
      calculated=true;
      expression.textContent=item.calc+" =";
      render();
      closeHistory();
    };

    historyList.appendChild(div);
  });
}

function clearHistory(){

  history=[];

  localStorage.removeItem(
    "mk_calculator_history"
  );

  renderHistory();
}

function openHistory(){

  renderHistory();
  historyPanel.classList.add("active");
}

function closeHistory(){
  historyPanel.classList.remove("active");
}

historyPanel.addEventListener("click",e=>{
  if(e.target===historyPanel){
    closeHistory();
  }
});

function escapeHTML(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function showError(){

  current="Error";
  stored=null;
  operator=null;
  waiting=true;
  calculated=false;

  expression.textContent="Invalid calculation";

  render();
}

document.addEventListener("keydown",e=>{

  if(e.key>="0"&&e.key<="9")
    inputNumber(e.key);

  else if(e.key===".")decimal();

  else if(["+","-","*","/"].includes(e.key))
    setOperator(e.key);

  else if(e.key==="%")
    percent();

  else if(e.key==="Enter"||e.key==="="){
    e.preventDefault();
    calculate();
  }

  else if(e.key==="Backspace")
    backspace();

  else if(e.key==="Escape"||e.key==="Delete")
    clearAll();
});

renderHistory();
render();
</script>

</body>
</html>
